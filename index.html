<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز التعليم الإلكتروني — منظومة الدورات التدريبية</title>
<meta name="theme-color" content="#0ea5e9">
<meta name="description" content="منظومة الدورات التدريبية — مركز التعليم الإلكتروني، جامعة الزاوية">
<meta property="og:title" content="مركز التعليم الإلكتروني — منظومة الدورات التدريبية">
<meta property="og:description" content="التعرّف على الدورات المتاحة، التسجيل، ومتابعة حالة التسجيل والمجموعات ورسائل الإدارة.">
<meta property="og:image" content="https://lh3.googleusercontent.com/d/1-V_QiHWPbCauKoUlMuprsnGNk0eqNgox">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1-V_QiHWPbCauKoUlMuprsnGNk0eqNgox">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0f766e; --teal2:#134e4a; --ink:#0f172a; --mut:#64748b;
    --line:#e2e8f0; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--ink); background:#f1f5f9;
  }

  /* ===== شاشة البوابة (الغلاف) ===== */
  #hero{
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
    background:
      radial-gradient(1200px 600px at 80% -10%, #e0f2fe 0%, transparent 55%),
      radial-gradient(900px 500px at 0% 110%, #bae6fd 0%, transparent 50%),
      linear-gradient(135deg, #7dd3fc, #0ea5e9);
  }
  .card{
    width:100%; max-width:560px; background:var(--card); border-radius:20px;
    padding:40px 32px; text-align:center;
    box-shadow:0 24px 60px rgba(2,6,23,.28); border:1px solid rgba(255,255,255,.6);
    animation:rise .55s cubic-bezier(.2,.7,.2,1) both;
  }
  .logos{
    display:flex; align-items:center; justify-content:center; gap:16px;
    min-height:104px; margin:0 auto 18px;
  }
  .logos img{max-height:96px; max-width:150px; object-fit:contain; display:none;
    animation:floaty 4.8s ease-in-out infinite; filter:drop-shadow(0 6px 14px rgba(2,6,23,.12))}
  .logos .fallback{
    width:104px; height:104px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#0ea5e9,#0369a1); color:#fff;
    font-size:46px; box-shadow:0 10px 24px rgba(14,165,233,.35);
    animation:floaty 4.8s ease-in-out infinite;
  }
  h1{font-size:23px; margin:0 0 6px}
  .sub{color:var(--mut); font-size:14.5px; margin:0 0 20px}
  .welcome{font-size:15px; line-height:1.95; color:#334155; margin:0 0 26px}
  .enter{
    appearance:none; border:0; cursor:pointer; width:100%;
    padding:15px 22px; border-radius:12px; font-size:17px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,#0ea5e9,#0284c7);
    box-shadow:0 10px 22px rgba(2,132,199,.35); transition:transform .08s, box-shadow .2s;
  }
  .enter:hover{transform:translateY(-1px); box-shadow:0 14px 26px rgba(2,132,199,.42)}
  .enter:active{transform:translateY(0)}
  .hint{margin-top:16px; font-size:12.5px; color:var(--mut)}
  .links{margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .links a{
    font-size:13px; color:#0369a1; text-decoration:none; border:1px solid var(--line);
    padding:8px 14px; border-radius:10px; background:#f8fafc;
  }
  .links a:hover{background:#eff6ff; border-color:#bae6fd}

  /* ===== شاشة المنظومة (التضمين) ===== */
  #stage{position:fixed; inset:0; z-index:2; background:#0369a1;
    opacity:0; visibility:hidden; transition:opacity .35s ease}
  #stage.on{opacity:1; visibility:visible}
  #stage iframe{width:100%; height:100%; border:0; display:block}
  #loader{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#e0f2fe; font-size:15px; gap:12px;
    transition:opacity .3s ease;
  }
  #loader.hide{opacity:0; pointer-events:none}
  #loader .sp{
    width:26px; height:26px; border-radius:50%;
    border:3px solid rgba(255,255,255,.25); border-top-color:#bae6fd;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{opacity:0; transform:translateY(16px) scale(.985)} to{opacity:1; transform:none}}
  @keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
  .foot{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
    font-size:11.5px; color:#94a3b8; line-height:1.9}
  @media (prefers-reduced-motion:reduce){
    .card,.logos img,.logos .fallback{animation:none}
    #stage,#loader{transition:none}
  }
  #back{
    position:fixed; top:12px; right:12px; z-index:5; display:none;
    border:0; cursor:pointer; padding:9px 14px; border-radius:10px;
    background:rgba(15,23,42,.72); color:#e2e8f0; font-size:13px; backdrop-filter:blur(4px);
  }
  #stage.on ~ #back{display:inline-block}

  @media (max-width:520px){
    .card{padding:30px 20px; border-radius:16px}
    h1{font-size:20px}
  }
</style>
</head>
<body>

  <!-- ================= شاشة البوابة ================= -->
  <main id="hero">
    <section class="card">
      <div class="logos" id="logoBox">
        <span class="fallback" id="brandFallback">🎓</span>
        <img id="logoUni" alt="شعار الجامعة">
        <img id="logoCenter" alt="شعار المركز">
      </div>

      <h1>مركز التعليم الإلكتروني</h1>
      <p class="sub">منظومة الدورات التدريبية</p>

      <p class="welcome">
        أهلاً بك. من هنا يمكنك التعرّف على الدورات المتاحة، وتسجيل بياناتك،
        ومتابعة حالة تسجيلك ومجموعتك ورسائل الإدارة.
      </p>

      <button class="enter" id="enterBtn">الدخول إلى المنظومة ←</button>
      <div class="hint">سيُفتح المحتوى داخل هذه الصفحة دون مغادرتها.</div>

      <div class="links">
        <a id="portalLink" href="#">بوابة المتدرب</a>
        <a id="coursesLink" href="#">الدورات والتسجيل</a>
      </div>

      <div class="foot">جامعة الزاوية · مركز التعليم الإلكتروني</div>
    </section>
  </main>

  <!-- ================= شاشة التضمين ================= -->
  <div id="stage">
    <div id="loader"><span class="sp"></span> جارٍ التحميل…</div>
    <iframe id="app" allow="clipboard-write; fullscreen" loading="eager" title="منظومة الدورات التدريبية"></iframe>
  </div>
  <button id="back">↩ رجوع للبوابة</button>

  <script>
    /* ====== إعدادات ====== */
    // رقم/معرّف النشر (ينتهي بـ /exec). إن تغيّر رابط النشر بدّله هنا فقط.
    var EXEC = "https://script.google.com/macros/s/AKfycbzwIWQplKXSJVMb5W21H4PuaRQ1UDKzRUGGrD2oYDv6Lok2WssY2HTVYZCECmBmCLIYyg/exec";

    // شعارا الصفحة: ضع روابط الصور هنا (اختياري).
    // إن تُركت فارغة، تحاول الصفحة تحميل "logo-uni.jpg" و"logo-center.jpg"
    // من نفس مجلد هذا الملف، وإن لم توجدا يبقى رمز 🎓 البديل.
    var LOGO_UNI = "https://lh3.googleusercontent.com/d/1okTy56_v-Gq3bh5Re9COXsX2n8QGAVJG"; // شعار الجامعة
    var LOGO_CENTER = "https://lh3.googleusercontent.com/d/1-V_QiHWPbCauKoUlMuprsnGNk0eqNgox"; // شعار المركز

    /* ====== سلوك ====== */
    var hero = document.getElementById('hero');
    var stage = document.getElementById('stage');
    var frame = document.getElementById('app');
    var loader = document.getElementById('loader');

    var fb = document.getElementById('brandFallback');
    function maybeHideFallback(){ if (fb) fb.style.display = 'none'; }
    function putLogo(el, src){
      if (!el || !src) return;
      el.onload  = function(){ el.style.display = 'block'; maybeHideFallback(); };
      el.onerror = function(){ el.style.display = 'none'; };
      el.src = src;
    }
    putLogo(document.getElementById('logoUni'),    LOGO_UNI    || "logo-uni.jpg");
    putLogo(document.getElementById('logoCenter'), LOGO_CENTER || "logo-center.jpg");

    function openApp(url){
      loader.classList.remove('hide');
      frame.setAttribute('src', url);
      hero.style.display = 'none';
      stage.classList.add('on');
      window.scrollTo(0,0);
    }

    document.getElementById('enterBtn').addEventListener('click', function(){ openApp(EXEC); });
    document.getElementById('portalLink').addEventListener('click', function(e){ e.preventDefault(); openApp(EXEC + "?page=me"); });
    document.getElementById('coursesLink').addEventListener('click', function(e){ e.preventDefault(); openApp(EXEC); });

    frame.addEventListener('load', function(){ loader.classList.add('hide'); });

    document.getElementById('back').addEventListener('click', function(){
      stage.classList.remove('on');
      hero.style.display = 'flex';
    });
  </script>
</body>
</html>
